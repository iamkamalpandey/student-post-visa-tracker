name: security

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 03:17 UTC — odd minute to avoid the top-of-hour stampede.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  pnpm-audit:
    name: pnpm audit (hard-fail on HIGH)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Hard-fails the build if any HIGH or CRITICAL prod advisory is present.
      # Mirrors the root "audit" npm script so devs can reproduce locally.
      - name: pnpm audit --prod --audit-level=high
        run: pnpm audit --prod --audit-level=high

  osv-scan:
    name: OSV scan (soft-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run osv-scanner against pnpm-lock.yaml
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=table

      - name: Summarise
        if: always()
        run: |
          {
            echo "## OSV Scanner"
            echo ""
            if [ "${{ steps.osv.outcome }}" = "success" ]; then
              echo ":white_check_mark: No advisories detected."
            else
              echo ":warning: Advisories detected — soft-fail. Review the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.cdx.json --output-format JSON || \
          npx --yes @cyclonedx/cdxgen@latest -o sbom.cdx.json -t pnpm .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  gitleaks:
    name: gitleaks (hard-fail on high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  # SVT-AUDIT-OPS-2026-05 — Trivy scans of the runtime container images
  # produced by the per-app Dockerfiles. Hard-fails on CRITICAL CVEs.
  trivy-images:
    name: trivy (container CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile -t spv-backend:scan .

      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile -t spv-frontend:scan .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: spv-backend:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          format: 'sarif'
          output: 'trivy-backend.sarif'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: spv-frontend:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          format: 'sarif'
          output: 'trivy-frontend.sarif'

      - name: Upload SARIF (backend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload SARIF (frontend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
