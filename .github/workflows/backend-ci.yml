name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-ci.yml'

# SVT-SEC-2026-05 — least-privilege workflow token. Repo default is
# write-all; this clamps to read-only so a compromised action can't push to
# main, create releases, or post comments without explicit job-level grant.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spv
          POSTGRES_PASSWORD: spv_ci_password
          POSTGRES_DB: spv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spv -d spv_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://spv:spv_ci_password@localhost:5432/spv_ci?schema=public
      DATABASE_MIGRATE_URL: postgresql://spv:spv_ci_password@localhost:5432/spv_ci?schema=public
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
      JWT_KID: ci-key
      JWT_ISSUER: spv-api
      JWT_AUDIENCE: spv-app
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 604800
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMeNow!2026
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc
        id: nvm
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      # SVT-CI-2026-08 — do NOT pin `version:` here. pnpm/action-setup@v5 hard
      # errors ("Multiple versions of pnpm specified") when a version is given
      # both in this block and via `packageManager` in the root package.json.
      # That killed this job at the SETUP step, which meant lint, typecheck,
      # the whole test suite and — most importantly — the `prisma migrate
      # deploy` step that exercises every migration against a real Postgres
      # never ran on any commit. The job went red in ~20s and read as "tests
      # failing" rather than "tests never executed".
      # package.json's packageManager field is the single source of truth;
      # security.yml already omits the version and works.
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SVT-SEC-2026-05 (P1-D3) — PR-time supply-chain gate. Mirrors the
      # nightly job in security.yml so HIGH/CRITICAL prod advisories block
      # merges, not just nightly main. --prod scopes out dev-only chains
      # (vitest>vite, etc.) that the runtime image never ships.
      - name: pnpm audit (prod, fail on HIGH/CRITICAL)
        run: pnpm audit --prod --audit-level=high

      - name: Generate ephemeral JWT keypair
        run: |
          openssl genpkey -algorithm RSA -out jwt_private.pem -pkeyopt rsa_keygen_bits:2048 2>/dev/null
          openssl rsa -in jwt_private.pem -pubout -out jwt_public.pem 2>/dev/null
          {
            echo "JWT_PRIVATE_KEY<<__EOF__"
            cat jwt_private.pem
            echo "__EOF__"
            echo "JWT_PUBLIC_KEY<<__EOF__"
            cat jwt_public.pem
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Build shared packages
        run: |
          pnpm --filter @spv/zod-schemas \
               --filter @spv/api-types \
               --filter @spv/utils \
               --filter @spv/tsconfig \
               --filter @spv/eslint-config \
               build

      - name: Prisma generate
        run: pnpm --filter backend prisma:generate

      # SVT-QA-2026-08 — apply the REAL migrations, not `db push`.
      #
      # Two things this buys, both previously untested anywhere:
      #   1. The ~50 migration files are exercised on every push. Before this,
      #      a broken migration was only discovered during a production deploy.
      #   2. The RLS policies, triggers and hash-chain functions live in
      #      raw-SQL migrations that `prisma db push` SKIPS entirely. Without
      #      this step, tests/rls-enforcement.integration.spec.ts has no
      #      policies to assert against and fails loudly (by design) rather
      #      than passing vacuously.
      - name: Prisma migrate deploy (exercises every migration + creates RLS policies)
        run: pnpm --filter backend prisma:migrate:deploy

      - name: Lint
        run: pnpm --filter backend lint

      - name: Typecheck
        run: pnpm --filter backend typecheck

      - name: Test
        run: pnpm --filter backend test

      # SVT-CI-COVERAGE-2026-06 — coverage VISIBILITY (non-blocking for now).
      # @vitest/coverage-v8 is now installed and the thresholds live in
      # apps/backend/vitest.config.ts (70/70/70/60), but they have never been
      # measured on a clean runner, so we report here without failing the
      # build. Once CI prints a confirmed baseline at/above the thresholds,
      # flip this to the gating `test:coverage` (drop continue-on-error) so a
      # coverage regression blocks the merge.
      - name: Coverage report (non-blocking until baseline confirmed)
        continue-on-error: true
        run: pnpm --filter backend test:coverage
